services:
  postgres:
    ports:
      - "5433:5432"

  api:
    build:
      target: build
    command: ["dotnet", "watch", "--project", "/src/MediTrack.API.csproj", "run", "--no-launch-profile", "--urls", "http://0.0.0.0:8080"]
    volumes:
      - ./backend/MediTrack.API:/src
      - backend-nuget-cache:/root/.nuget/packages

  frontend:
    build:
      target: build
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    volumes:
      - ./frontend/meditrack-ui:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  backend-nuget-cache:
  frontend-node-modules:
