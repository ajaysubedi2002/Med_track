services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - ./.env
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - meditrack-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend/MediTrack.API
      dockerfile: Dockerfile
      target: build
    env_file:
      - ./.env
    restart: unless-stopped
    command: ["dotnet", "watch", "--project", "/src/MediTrack.API.csproj", "run", "--no-launch-profile", "--urls", "http://0.0.0.0:8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./backend/MediTrack.API:/src
      - backend-nuget-cache:/root/.nuget/packages
    depends_on:
      migrations:
        condition: service_completed_successfully

  migrations:
    build:
      context: ./backend/MediTrack.API
      dockerfile: Dockerfile
      target: migrations
    env_file:
      - ./.env
    command: ["dotnet", "ef", "database", "update", "--project", "MediTrack.API.csproj"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/meditrack-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    volumes:
      - ./frontend/meditrack-ui:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started

volumes:
  meditrack-postgres-data:
  backend-nuget-cache:
  frontend-node-modules:
